spring:
  application:
    name: hrpayroll

  # Phone photos of a director's ID are often over Spring's default 1 MB. Each service sets its own lower limit.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://localhost:5433/hrpayroll
    username: hrpayroll_user
    password: hrpayroll@128
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  data:
    redis:
      host: localhost
      port: 6379


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  # Local defaults point at MailHog (http://localhost:8025). Production sets the MAIL_ variables.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  address: 0.0.0.0
  port: 8081

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@dhwarsh.local}
  biometric:
    # Base64 of 32 random bytes. Back it up: losing it means every fingerprint has to be enrolled again.
    template-key: ${BIOMETRIC_TEMPLATE_KEY:}
  credentials:
    # Encrypts the passwords the Admin sets, so they can be looked up later. Base64 of 32 random bytes.
    # Left unset, a key derived from BIOMETRIC_TEMPLATE_KEY is used instead.
    key: ${CREDENTIAL_KEY:}
  jwt:
    secret: 24hx2bKUfYqv6pY0ydoUW9FdDQIpPoesNaH62ICiiBk=
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000