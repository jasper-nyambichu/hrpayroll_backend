spring:
  application:
    name: hrpayroll

  datasource:
    url: jdbc:postgresql://localhost:5433/hrpayroll
    username: hrpayroll_user
    password: hrpayroll@128

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8080