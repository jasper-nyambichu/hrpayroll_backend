spring:
  application:
    name: hrpayroll

  # Phone photos of a director's ID are often over Spring's default 1 MB. Each service sets its own lower limit.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:postgresql://localhost:5433/hrpayroll
    username: hrpayroll_user
    password: hrpayroll@128
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  data:
    redis:
      host: localhost
      port: 6379


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  address: 0.0.0.0
  port: 8081

app:
  jwt:
    secret: 24hx2bKUfYqv6pY0ydoUW9FdDQIpPoesNaH62ICiiBk=
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000