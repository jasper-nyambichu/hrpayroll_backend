
name: HR Payroll CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jasper-nyambichu/hrpayroll_backend

jobs:
  test:
    name: Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: chmod +x mvnw && ./mvnw -B test

  build-and-deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jasper-nyambichu/hrpayroll_backend:${{ github.sha }}
            ghcr.io/jasper-nyambichu/hrpayroll_backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/hrpayroll_backend
            export IMAGE_TAG=${{ github.sha }}
            docker compose -p hrpayroll_backend -f docker-compose.prod.yml pull backend
            docker compose -p hrpayroll_backend -f docker-compose.prod.yml up -d --no-deps backend
            docker compose -p hrpayroll_backend -f docker-compose.prod.yml ps backend
            sleep 10
            if ! docker inspect -f '{{.State.Running}}' hrpayroll-backend | grep -qx true; then
              docker logs --tail 100 hrpayroll-backend
              exit 1
            fi
