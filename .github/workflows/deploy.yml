  name: HR Payroll CI/CD

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  permissions:
    contents: read
    packages: write
    id-token: write

  env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/jasper-nyambichu/hrpayroll_backend

  jobs:
    test:
      name: Test Spring Boot
      runs-on: ubuntu-latest

      # Temporary PostgreSQL database for CI tests only.
      # This does not connect to or modify the production database.
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_DB: hrpayroll_test
            POSTGRES_USER: hrpayroll_test
            POSTGRES_PASSWORD: test_password
          ports:
            - 5433:5432
          options: >-
            --health-cmd "pg_isready -U hrpayroll_test -d hrpayroll_test"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/hrpayroll_test
        SPRING_DATASOURCE_USERNAME: hrpayroll_test
        SPRING_DATASOURCE_PASSWORD: test_password

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Java 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Run tests
          run: chmod +x mvnw && ./mvnw -B test

        - name: Show test reports on failure
          if: failure()
          run: |
            echo "=== Surefire test reports ==="
            find target/surefire-reports -maxdepth 1 -type f -print
            for f in target/surefire-reports/*.txt; do
              [ -f "$f" ] || continue
              echo "=== $f ==="
              cat "$f"
            done

    build-and-deploy:
      name: Build and deploy
      needs: test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Connect to Tailscale
          uses: tailscale/github-action@v4
          with:
            oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
            audience: ${{ secrets.TS_AUDIENCE }}
            tags: tag:github-ci
            log-mode: normal

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and publish image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ghcr.io/jasper-nyambichu/hrpayroll_backend:${{ github.sha }}
              ghcr.io/jasper-nyambichu/hrpayroll_backend:latest

        # The compose file and server scripts travel with each release, so the server never runs an old copy.
        - name: Copy deploy files to VPS
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            source: "docker-compose.prod.yml,deploy/backup.sh,deploy/restore-check.sh,deploy/new-organisation.sql"
            target: "dhwarsh-deploy"   # relative to the deploy user's home

        - name: Deploy to VPS
          uses: appleboy/ssh-action@v1.2.2
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              set -eu
              export IMAGE_TAG=${{ github.sha }}
              chmod +x ~/dhwarsh-deploy/deploy/*.sh || true

              # One folder per organisation (see docker-compose.prod.yml), deployed one after the other.
              #  - A folder that does not exist yet is skipped (an organisation can be listed before it is set up).
              #  - A folder holding a file named HOLD is skipped: that organisation stays on its current version
              #    until the file is removed (rm ~/<stack>/HOLD).
              #  - If one organisation fails its health check, the deploy stops there and the rest are untouched.
              for stack in kisiimatt shahceramics; do
                [ -f ~/"$stack"/.env ] || { echo "skip $stack: not set up"; continue; }
                [ -f ~/"$stack"/HOLD ] && { echo "skip $stack: on hold ($(head -c 200 ~/"$stack"/HOLD))"; continue; }
                echo "=== deploying $stack ==="
                cd ~/"$stack"
                [ -f docker-compose.prod.yml ] && cp docker-compose.prod.yml docker-compose.prod.yml.previous
                cp ~/dhwarsh-deploy/docker-compose.prod.yml docker-compose.prod.yml
                docker compose -p "$stack" -f docker-compose.prod.yml pull backend
                docker compose -p "$stack" -f docker-compose.prod.yml up -d --no-deps backend

                # Wait until it answers HTTP (the container health check), up to 4 minutes.
                status=starting
                for i in $(seq 1 48); do
                  status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$stack-backend" 2>/dev/null || echo missing)
                  [ "$status" = healthy ] && break
                  [ "$status" = unhealthy ] && break
                  sleep 5
                done
                if [ "$status" != healthy ]; then
                  echo "!!! $stack is $status after deploying $IMAGE_TAG"
                  docker logs --tail 100 "$stack-backend"
                  exit 1
                fi
                port=$(grep -E '^BACKEND_PORT=' .env | cut -d= -f2); port=${port:-8081}
                echo "smoke test $stack: $(curl -fsS "http://127.0.0.1:$port/public/organisation" | head -c 200)"
              done

              # Old images pile up with every release; keep a week's worth for rolling back.
              docker image prune -af --filter "until=168h" >/dev/null || true
