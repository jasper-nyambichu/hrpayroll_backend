version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrpayroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - hrpayroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrpayroll-net
  backend:
    build: .
    container_name: hrpayroll-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JDK_JAVA_OPTIONS: "-Xmx400m -Xms128m"
    ports:
      - "8081:8080"
    networks:
      - hrpayroll-net
volumes:
  hrpayroll_pgdata:
networks:
  hrpayroll-net:
    driver: bridge
